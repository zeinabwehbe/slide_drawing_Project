<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Drawing Participant View</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toolbar">
        <label for="color-picker">Color:</label>
        <input type="color" id="color-picker" value="#000000">
        
        <label for="line-width">Size:</label>
        <input type="range" id="line-width" min="1" max="20" value="5">

        <button id="eraser-btn">Eraser</button>
        <button id="pen-btn" class="active">Pen</button>
        <button id="submit-btn">Submit Drawing (Phase 2)</button>
    </div>
    
    <!-- The drawing area -->
    <canvas id="drawing-board"></canvas>

    <script src="script.js"></script>
</body>
</html>
